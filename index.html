<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Portfolio Cockpit v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<style>:root{color-scheme:dark;--page:#070a14;--ink:#eef2ff;--ink2:#a9b4d6;--ink3:#7d89ad;--card:rgba(8,14,32,.36);--card-b:rgba(120,170,255,.22);--grid:rgba(160,180,255,.10);--grid2:rgba(160,180,255,.24);--track:rgba(255,255,255,.08);--tip:rgba(14,20,40,.96);--accent:#56B4E9;--acc:86,180,233;--bad:254,106,178;--s1:#0072B2;--s2:#D55E00;--s3:#A276FC;--s4:#009E73;--s5:#F0E442;--s6:#56B4E9;--s7:#E69F00;--st-good:#7AFFBF;--st-watch:#D3C0B7;--st-bad:#FE6AB2;--st-neutral:#EDFEFF}

*{box-sizing:border-box}
:root{--r:16px;--blur:blur(3px) saturate(125%);--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.2,.8,.2,1);
  --glow:0 0 0 1px rgba(var(--acc),.38),0 12px 42px rgba(20,60,160,.5);
  --bg:radial-gradient(1400px 720px at 6% -14%,rgba(29,42,90,.55) 0%,rgba(11,16,32,0) 62%),
       linear-gradient(180deg,#050914 0%,#03050c 100%)}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;display:block}
.ind-banner,.stale-banner,.wrap{position:relative;z-index:1}
html{background:var(--page)}
body{margin:0;min-height:100vh;background:var(--bg) fixed,var(--page);color:var(--ink);
  font:14.5px/1.5 Inter,system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:1840px;margin:0 auto;padding:0 40px 56px}
.ind-banner{display:flex;gap:10px;align-items:center;justify-content:center;padding:7px 20px;font-size:12.5px;
  color:var(--ink2);border-bottom:1px dotted rgba(169,180,214,.5);background:rgba(255,255,255,.025)}
.ind-banner b{color:var(--ink);letter-spacing:.08em}
.stale-banner{display:none;align-items:center;gap:12px;justify-content:center;padding:10px 20px;font-weight:600;
  border:2px solid var(--st-bad);background:rgba(var(--bad),.12)}
.stale-banner b{color:var(--st-bad);letter-spacing:.06em}
body.stale .stale-banner{display:flex}
header.top{display:flex;align-items:center;gap:18px;padding:22px 0 12px}
.brand{display:flex;gap:12px;align-items:center}
.brand .logo{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;font-size:21px;color:var(--accent);
  background:linear-gradient(135deg,rgba(var(--acc),.32),rgba(var(--acc),.04));border:1px solid var(--card-b);box-shadow:var(--glow)}
.brand b{display:block;font-size:19px;letter-spacing:-.01em}
.fresh{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--card-b);background:var(--card);border-radius:999px;
  padding:5px 14px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.fresh .g{color:var(--st-good)} body.stale .fresh{border:2px solid var(--st-bad);color:var(--ink)} body.stale .fresh .g{color:var(--st-bad)}
.sp{flex:1}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--card-b);gap:2px}
.seg button{font-weight:650;font-size:13px;color:var(--ink2);background:transparent;border:0;border-radius:9px;padding:7px 18px;cursor:pointer;
  transition:background .25s,color .25s,box-shadow .25s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--accent);color:#06101f;box-shadow:0 4px 18px rgba(var(--acc),.45)}
.seg .lbl{align-self:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:0 8px 0 6px}
.ghost{font-weight:650;font-size:12.5px;color:var(--ink2);background:transparent;border:1px dotted var(--ink2);border-radius:10px;padding:8px 12px;cursor:pointer}
.ghost[aria-pressed=true]{border:2px solid var(--st-bad);color:var(--ink)}
nav.tabs{position:relative;display:flex;gap:4px;border-bottom:1px solid var(--grid);margin-bottom:22px}
nav.tabs button{font-weight:650;font-size:15px;color:var(--ink2);background:none;border:0;padding:12px 20px 14px;cursor:pointer;transition:color .25s}
nav.tabs button:hover{color:var(--ink)} nav.tabs button[aria-selected=true]{color:var(--ink)}
nav.tabs .ink{position:absolute;bottom:-2px;height:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 16px var(--accent);
  transition:left .5s var(--ease),width .5s var(--ease)}
.pane{display:none}.pane.on{display:block}
.pane.on.from-r{animation:slideR .5s var(--ease) backwards}.pane.on.from-l{animation:slideL .5s var(--ease) backwards}
@keyframes slideR{from{opacity:0;transform:translateX(44px)}}
@keyframes slideL{from{opacity:0;transform:translateX(-44px)}}
.rise{animation:rise .65s var(--ease) backwards;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

/* ---- glass cards + lift-and-glow (3A) with a springy return (2C) ---- */
.card,.tile{position:relative;z-index:1;background:var(--card);border:1px solid var(--card-b);border-radius:var(--r);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);padding:18px 20px;
  transition:transform .5s var(--spring),box-shadow .3s,border-color .3s}
.card:hover,.tile:hover{transform:translateY(-4px);box-shadow:var(--glow);border-color:rgba(var(--acc),.62);z-index:5}
.card:focus-within,.tile:focus-within{z-index:6}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:22px}
.ch h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.ch .aside{margin-left:auto;font-size:12px;color:var(--ink3);text-align:right}
.tag{font-size:11px;font-weight:700;border:1px dotted var(--ink2);color:var(--ink2);border-radius:6px;padding:1px 7px;white-space:nowrap}
.tag.cons{border-style:solid;border-color:var(--grid2)}
.pane>.card,.pane>section.card{margin-bottom:18px}
.g2,.g3,.g4,.g-front2,.g-risk,.g-perf{display:grid;gap:18px;margin-bottom:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-front2{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}.g-risk{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.g-perf{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}
.col{display:flex;flex-direction:column;gap:18px}
.ec{width:100%}.h-90{height:90px}.h-200{height:200px}.h-300{height:300px}.h-320{height:320px}.h-400{height:400px}
.h-420{height:420px}.h-440{height:440px}.h-460{height:460px}
.ec-off{display:grid;place-items:center;color:var(--ink3);font-size:13px;border:1px dotted var(--ink3);border-radius:12px}
.muted{color:var(--ink3)}

/* ---- KPI tiles: count-up, shimmer, glow pulse ---- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:18px}
.tile{padding:18px 22px 16px;min-height:168px}
.tile .l{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:750}
.tile .l .tag{margin-left:auto;text-transform:none;letter-spacing:0}
.tile .n{display:flex;align-items:baseline;gap:10px;font-weight:800;font-size:38px;line-height:1.1;letter-spacing:-.02em;margin:12px 0 6px;
  animation:glowpulse 1.6s ease .7s backwards}
.tile .n .arr{font-size:26px}
.tile .n.await{font-size:22px;color:var(--ink2);border:1px dotted var(--ink3);border-radius:10px;padding:8px 12px;display:inline-flex;animation:none}
.tile .d{font-size:13px;color:var(--ink2)}.tile .d b{color:var(--ink)}
@keyframes glowpulse{0%{text-shadow:0 0 0 transparent}40%{text-shadow:0 0 22px var(--accent)}100%{text-shadow:0 0 0 transparent}}
.shimmer{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.13) 50%,transparent 70%);background-size:250% 100%;animation:shim 1.3s ease .35s}
@keyframes shim{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-120% 0}}
.ce-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--track);margin-top:10px}
.ce-bar span{transform-origin:left;animation:grow 1.1s var(--ease) .35s backwards}
.ce-bar .eq{background:var(--s1)}
.ce-bar .ca{min-width:5px;background-color:var(--s6);background-image:repeating-linear-gradient(45deg,transparent 0 2px,rgba(7,10,20,.5) 2px 4px)}
@keyframes grow{from{transform:scaleX(0)}}
.ce-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:6px}.ce-lab b{color:var(--ink)}
.help{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--ink3);
  color:var(--ink2);font-size:10.5px;font-weight:800;cursor:help;text-transform:none;letter-spacing:0;flex:none}
.help:hover::after,.help:focus::after{content:attr(data-tip);position:absolute;left:-8px;top:26px;z-index:60;width:320px;padding:10px 12px;
  border-radius:10px;background:var(--tip);border:1px solid var(--card-b);color:var(--ink);font:500 12.5px/1.5 Inter,sans-serif;
  box-shadow:0 14px 34px rgba(0,0,0,.55);white-space:normal}
.up{color:var(--st-good);font-weight:700;white-space:nowrap}.dn{color:var(--st-bad);font-weight:700;white-space:nowrap}
.flat{color:var(--ink2);white-space:nowrap}

/* ---- tier encoding: glyph + word + border style, never hue alone ---- */
.tb{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:11px;line-height:1.6;letter-spacing:.06em;padding:1px 8px;
  border-radius:6px;white-space:nowrap;color:var(--ink)}
.tb i{font-style:normal}
.t-act{border:2px solid var(--st-bad)}.t-act i{color:var(--st-bad)}
.t-rev{border:2px dashed var(--st-watch)}.t-rev i{color:var(--st-watch)}
.t-fyi{border:2px dotted var(--st-neutral)}.t-fyi i{color:var(--st-neutral)}
.st{font-size:11.5px;font-weight:800;letter-spacing:.04em;margin-left:auto;padding:1px 8px;border-radius:6px;white-space:nowrap}
.st-watch{border:2px dashed var(--st-watch)}.st-good{border:1px solid var(--st-good)}.st-neutral{border:2px dotted var(--st-neutral)}

/* ---- sunburst + legend ---- */
.sun{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:center}
.sunlg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.sunlg li{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:start;padding:6px 8px;border-radius:9px;cursor:default;
  transition:background .2s}
.sunlg li:hover{background:rgba(255,255,255,.06)}
.sunlg .nm{font-size:13px;font-weight:650;line-height:1.3}.sunlg small{display:block;color:var(--ink3);font-weight:500;font-size:11.5px}
.sunlg b{font-size:13px}
.sw{width:16px;height:16px;border-radius:4px;background-color:var(--c);margin-top:1px}
.sw1{background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(7,10,20,.5) 3px 5px)}
.sw2{background-image:radial-gradient(rgba(7,10,20,.6) 1.4px,transparent 1.7px);background-size:5px 5px}
.sw3{background-image:repeating-linear-gradient(-45deg,transparent 0 3px,rgba(7,10,20,.5) 3px 5px)}
.sw4{background-image:radial-gradient(rgba(7,10,20,.6) 2.1px,transparent 2.5px);background-size:8px 8px}
.sw5{background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(7,10,20,.5) 3px 5px)}
.sw6{background-image:linear-gradient(45deg,rgba(7,10,20,.45) 25%,transparent 25% 75%,rgba(7,10,20,.45) 75%);background-size:7px 7px}

/* ---- calendar ---- */
.cal-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cal-nav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--card-b);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;
  transition:transform .4s var(--spring),box-shadow .25s}
.cal-nav button:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--glow)}
.cal-nav button:disabled{opacity:.3;cursor:default}
.cal-lg{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--ink2);margin-left:auto}
.cal-months{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.mh{font-weight:800;font-size:16px;margin:0 0 8px}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;padding:0 6px 2px;font-weight:700}
.cd{min-height:96px;border-radius:10px;padding:5px 6px;background:rgba(255,255,255,.03);border:1px solid rgba(140,170,255,.08);
  display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .2s,border-color .2s}
.cd:hover{background:rgba(255,255,255,.07);border-color:rgba(var(--acc),.4)}
.cd.blank{background:transparent;border-color:transparent}
.cd.past{opacity:.42}.cd.we{background:rgba(255,255,255,.012)}
.cd .dnum{font-size:12px;font-weight:700;color:var(--ink2)}
.cd.today{border:2px solid var(--accent);box-shadow:0 0 18px rgba(var(--acc),.35);opacity:1}
.cd.today .dnum::after{content:"  TODAY";color:var(--accent);font-size:10px;letter-spacing:.08em}
.ev{display:flex;align-items:center;gap:4px;font-weight:700;font-size:11.5px;line-height:1.55;border-radius:6px;padding:0 6px;white-space:nowrap;
  overflow:hidden;min-width:0}
.ev small{margin-left:auto;font-weight:600;color:var(--ink2);font-size:10.5px}
.ev-e{background:rgba(var(--acc),.2);border:1.5px solid var(--accent)}
.ev-x{border:1.5px dashed var(--ink2)}
.ev-p{border:1.5px dotted var(--ink2);color:var(--ink2)}
.ev-more{font-size:11px;color:var(--ink3);padding-left:4px}

/* ---- Needs you: strip + kanban ---- */
.needs{margin-top:30px}
.sh{font-size:22px;margin:0 0 12px;letter-spacing:-.01em}
.strip{display:flex;align-items:center;gap:18px;padding:14px 20px;margin-bottom:16px}
.sx{display:flex;align-items:center;gap:10px;padding-right:20px;border-right:1px solid var(--grid)}
.sx b{font-size:26px;font-weight:800;line-height:1}.sx .k{font-size:12px;color:var(--ink2)}
.sx.note{border:0;color:var(--ink3);font-size:12.5px;margin-left:auto;padding-right:0}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.kcol{border-radius:var(--r);padding:14px;background:rgba(8,14,32,.34);backdrop-filter:blur(6px);border:1px solid var(--card-b)}
.kcol>header{display:flex;align-items:center;gap:10px;padding:2px 4px 12px;margin-bottom:12px}
.k-act>header{border-bottom:3px solid var(--st-bad)}.k-rev>header{border-bottom:3px dashed var(--st-watch)}
.k-fyi>header{border-bottom:3px dotted var(--st-neutral)}
.kcol .cnt{margin-left:auto;font-size:22px;font-weight:800}
.qc{position:relative;background:var(--card);border:1px solid var(--card-b);border-radius:12px;padding:12px 14px 10px;margin-bottom:10px;
  transition:transform .45s var(--spring),box-shadow .3s,border-color .3s}
.qc:hover{transform:translateY(-3px);box-shadow:var(--glow);border-color:rgba(var(--acc),.55)}
.qc-act{border-left:5px solid var(--st-bad)}.qc-rev{border-left:5px dashed var(--st-watch)}.qc-fyi{border-left:5px dotted var(--st-neutral)}
.qc header{display:flex;gap:8px;align-items:baseline}.qc .lab{font-size:16px}
.qc .kind{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:750}
.qc .since{margin-left:auto;font-size:11.5px;color:var(--ink3)}
.qc .what{margin:6px 0;font-size:13.5px}
.qc details summary{cursor:pointer;color:var(--accent);font-size:12.5px;font-weight:650;list-style:none}
.qc details summary::before{content:"▸ ";display:inline-block;transition:transform .3s}
.qc details[open] summary::before{transform:rotate(90deg)}
.qc .sig{border-top:1px solid var(--grid);padding-top:6px;margin-top:6px;font-size:13px;color:var(--ink2)}.qc .sig p{margin:3px 0}
.qc .sig b{color:var(--ink)}
.kempty{color:var(--ink3);font-size:13px;padding:4px 6px 8px;line-height:1.55}
.chips{margin:4px 0 2px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;border:1px solid var(--card-b);border-radius:6px;padding:0 7px;margin:3px 4px 0 0;
  background:rgba(255,255,255,.04)}

/* ---- gauges ---- */
.gauge{padding-bottom:14px}
.gauge .gsub{font-size:12.5px;color:var(--ink2);text-align:center;margin-top:-4px;min-height:38px}
.gauge .gsub b{color:var(--ink)}
.fgh{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--ink2);margin-top:4px}.fgh b{color:var(--ink)}

/* ---- tables ---- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:750;text-align:left;padding:8px 10px;
  border-bottom:1px solid var(--grid2);white-space:nowrap}
.tbl th.n,.tbl td.n{text-align:right}
.gk{text-transform:none;font-size:1.15em}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
.tbl td small{display:block;color:var(--ink3);font-size:11.5px}
.tbl tbody tr{transition:background .2s}.tbl tbody tr:hover{background:rgba(255,255,255,.045)}
.tbl th[data-sort]{cursor:pointer}.tbl th[data-sort]:hover{color:var(--ink)}.tbl th .sa{color:var(--accent)}
.acct{font-size:10.5px;font-weight:750;letter-spacing:.05em;border:1px solid var(--grid2);border-radius:5px;padding:0 5px;color:var(--ink2);margin-left:6px}
.flag{display:inline-block;font-size:11px;font-weight:700;color:var(--ink2);border:1px dotted var(--ink2);border-radius:5px;padding:0 5px;
  margin:1px 4px 1px 0;white-space:nowrap}
tr.hr{cursor:pointer}
tr.hr td:first-child::before{content:"▸";color:var(--ink3);margin-right:8px;display:inline-block;transition:transform .3s var(--ease)}
tr.hr.open td:first-child::before{transform:rotate(90deg);color:var(--accent)}
tr.hr.open td{background:rgba(var(--acc),.07)}
tr.hd{display:none}tr.hd.open{display:table-row}
tr.hd>td{background:rgba(255,255,255,.028);padding:16px 18px 18px}
.hdg{display:grid;grid-template-columns:280px 1fr 1fr 1.15fr 1.5fr;gap:24px;animation:rise .45s var(--ease) backwards}
.hdg h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv span{color:var(--ink3)}
.perf-top{display:flex;align-items:center;gap:20px;margin-bottom:18px}
.psum{display:flex;gap:26px;font-size:13px;color:var(--ink2)}.psum b{display:block;font-size:22px;color:var(--ink);font-weight:800}
.mult{font-size:12px;line-height:1.5;white-space:nowrap}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(4,7,16,.7)}
.gate[hidden]{display:none}.gate form{width:min(520px,92vw);padding:26px 28px;display:grid;gap:12px}
.gate h3{margin:0;font-size:20px}.gate label{display:grid;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.gate input{font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--card-b);background:rgba(255,255,255,.04);color:var(--ink)}
.gate-msg{min-height:1.2em;margin:0;color:var(--st-bad);font-weight:600}.gate-row{display:flex;gap:10px}
.gate button{font:inherit;font-weight:750;padding:9px 16px;border-radius:10px;border:1px solid var(--accent);background:rgba(var(--acc),.18);color:var(--ink);cursor:pointer}
.gate button.ghost{border-color:var(--card-b);background:none}
</style>
</head>
<body>
<div id="gate" class="gate" hidden><form id="gate-form" class="card"><h3>Portfolio cockpit</h3>
<p class="muted">This page holds no data. It reads your private data repo with a fine-grained <b>read-only</b> GitHub token, kept only in this browser.</p>
<label>Data repo (owner/name)<input id="gate-repo" autocomplete="off" spellcheck="false" required></label>
<label>Read-only token<input id="gate-token" type="password" autocomplete="off" spellcheck="false" required></label>

<script>window.__cockpit = function(){
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('cockpit-data').textContent);
const PAL = {"series": ["#0072B2", "#D55E00", "#A276FC", "#009E73", "#F0E442", "#56B4E9", "#E69F00"], "status": {"GOOD": "#7AFFBF", "WATCH": "#D3C0B7", "BAD": "#FE6AB2", "NEUTRAL": "#EDFEFF"}, "accent": "#56B4E9", "page": "#070a14", "ink": "#eef2ff", "ink2": "#a9b4d6", "ink3": "#7d89ad", "card": "rgba(8,14,32,.36)", "card_b": "rgba(120,170,255,.22)", "grid": "rgba(160,180,255,.10)", "grid2": "rgba(160,180,255,.24)", "track": "rgba(255,255,255,.08)", "tip": "rgba(14,20,40,.96)"};

const BAR = DATA.meta.double_bar, TODAY = DATA.meta.today;

const IND = !!DATA.meta.indicative, SRC = IND ? '✓ T212' : '✓ ledger', ind = (proto, live) => IND ? proto : live;
// Sector/region map captions show only while George has lines unconfirmed (emitter sends '' once confirmed).
const prov = (k, txt) => (DATA.meta.provisional || {})[k] ? tag(txt) : '';
const closeValue = s => { const a = s.perf.ranges.YTD.actual; return a[a.length - 1]; };

/* ------------------------------ formatting ------------------------------ */
const MINUS = '−';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function gbp(v, dp=0, sign=false){ if(v==null||isNaN(v)) return '–';
  const a = Math.abs(v).toLocaleString('en-GB',{minimumFractionDigits:dp,maximumFractionDigits:dp});
  return (v<0 ? MINUS : (sign ? '+' : '')) + '£' + a; }
function gbpk(v, sign=false){ if(v==null||isNaN(v)) return '–'; const a = Math.abs(v);
  const s = a>=1e6 ? (a/1e6).toFixed(2)+'m' : a>=1e4 ? (a/1e3).toFixed(1)+'k' : a>=1e3 ? (a/1e3).toFixed(2)+'k' : a.toFixed(0);
  return (v<0 ? MINUS : (sign ? '+' : '')) + '£' + s; }
function pct(v, dp=1, sign=true){ if(v==null||isNaN(v)) return '–';
  return (v<0 ? MINUS : (sign && v>0 ? '+' : '')) + (Math.abs(v)*100).toFixed(dp) + '%'; }
function mv(v, txt, eps=1e-9){ if(v==null||isNaN(v)) return '<span class="flat">–</span>';
  if(Math.abs(v) < eps) return `<span class="flat">→ ${txt}</span>`;
  return v>0 ? `<span class="up">↑ ${txt}</span>` : `<span class="dn">↓ ${txt}</span>`; }
const arrow = v => v>0 ? '<span class="arr up">↑</span>' : v<0 ? '<span class="arr dn">↓</span>' : '<span class="arr flat">→</span>';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y, m-1, d)); };
const iso = d => d.toISOString().slice(0,10);
const dShort = s => { const d = pd(s); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const dNice = s => { const d = pd(s); return `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const dLong = s => { const d = pd(s); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const days = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const CCY = {USD:'$', GBP:'£', GBX:'£', EUR:'€'};
const px = (v, c) => v==null ? '–' : (CCY[c]||'') + Number(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = (v, dp=2) => v==null||isNaN(v) ? '–' : (v<0 ? MINUS : '') + Math.abs(v).toFixed(dp);

function hexA(h, a){ const n = parseInt(h.slice(1), 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

const tag = (txt, cls='') => `<span class="tag ${cls}">${txt}</span>`;
const AWAIT = what => `<div class="n await">◇ awaiting T212</div><div class="d">Needs the ${esc(what)}. The back-cast estimate was wrong, so it is no longer shown.</div>`;
const help = t => `<span class="help" tabindex="0" data-tip="${esc(t)}">?</span>`;
const FMT = {gbp:v=>gbp(v), gbps:v=>gbp(v,0,true), gbps2:v=>gbp(v,2,true), pct:v=>pct(v), int:v=>String(Math.round(v))};

/* ------------------------------ ONE chart wrapper ------------------------------ */
// Every chart goes through Chart.mount(): the report_html palette, glass tooltip,
// Inter, motion on/off and (for part-to-whole) aria.decal patterns live here only.
const DK = 'rgba(7,10,20,0.5)';
const DECALS = [
  {symbol:'none'},
  {symbol:'rect', dashArrayX:[1,0], dashArrayY:[3,4], rotation:Math.PI/4, color:DK},
  {symbol:'circle', symbolSize:0.7, dashArrayX:[4,4], dashArrayY:[4,4], color:DK},
  {symbol:'rect', dashArrayX:[1,0], dashArrayY:[3,4], rotation:-Math.PI/4, color:DK},
  {symbol:'circle', symbolSize:0.9, dashArrayX:[7,7], dashArrayY:[7,7], color:DK},
  {symbol:'rect', dashArrayX:[1,0], dashArrayY:[3,4], rotation:0, color:DK},
  {symbol:'diamond', symbolSize:0.9, dashArrayX:[7,7], dashArrayY:[7,7], color:DK},
];
const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
function merge(a, b){ const o = Object.assign({}, a);
  for(const k in b){ o[k] = isObj(a[k]) && isObj(b[k]) ? merge(a[k], b[k]) : b[k]; } return o; }
const Chart = (() => {
  const ok = typeof echarts !== 'undefined';
  const base = () => ({
    backgroundColor:'transparent', color:PAL.series,
    textStyle:{fontFamily:'Inter, system-ui, sans-serif', color:PAL.ink2, fontSize:12},
    animation:!RM, animationDuration:1100, animationEasing:'cubicOut', animationDurationUpdate:650,
    aria:{enabled:true},
    tooltip:{confine:true, backgroundColor:PAL.tip, borderColor:PAL.card_b, borderWidth:1, padding:[8,12],
      textStyle:{color:PAL.ink, fontFamily:'Inter, sans-serif', fontSize:12.5},
      extraCssText:'border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.5);'},
  });
  function mount(el, option, o={}){
    if(!ok){ el.classList.add('ec-off'); el.textContent = '◇ chart engine not loaded (offline?) — numbers are in the tables'; return null; }
    const old = echarts.getInstanceByDom(el); if(old) old.dispose();
    const c = echarts.init(el, null, {renderer:'canvas'});
    let opt = merge(base(), option);
    if(o.decal) opt.aria = {enabled:true, decal:{show:true, decals:DECALS}};
    c.setOption(opt);
    return c;
  }
  function update(c, option){ if(c) c.setOption(merge(base(), option), true); }
  function disposeIn(root){ if(!ok) return; root.querySelectorAll('.ec').forEach(el => { const c = echarts.getInstanceByDom(el); if(c) c.dispose(); }); }
  window.addEventListener('resize', () => { if(!ok) return; document.querySelectorAll('.ec').forEach(el => { const c = echarts.getInstanceByDom(el); if(c) c.resize(); }); });
  return {mount, update, disposeIn, ok};
})();
const AX = o => merge({axisLine:{lineStyle:{color:PAL.grid2}}, axisTick:{show:false}, axisLabel:{color:PAL.ink2, fontSize:11.5},
  splitLine:{lineStyle:{color:PAL.grid}}, nameTextStyle:{color:PAL.ink2, fontWeight:700, fontSize:11.5}}, o||{});
const LBL = {color:'#fff', fontWeight:800, textBorderColor:'rgba(7,10,20,.88)', textBorderWidth:3, fontFamily:'Inter, sans-serif'};

/* deferred mounts: renderers return HTML and queue the chart for after insertion */
let pending = [], uid = 0;
function slot(fn, cls='', style=''){ const id = 'ec' + (++uid); pending.push([id, fn]);
  return `<div class="ec ${cls}" id="${id}" style="${style}"></div>`; }
function flush(){ const p = pending; pending = []; p.forEach(([id, fn]) => { const el = document.getElementById(id); if(el) fn(el); }); }
const card = (title, body, o={}) => `<section class="card rise ${o.cls||''}" ${o.id?`id="${o.id}"`:''}><header class="ch"><h3>${title}</h3>${o.tags||''}<span class="aside">${o.aside||''}</span></header>${body}</section>`;

/* ------------------------------ chart options ------------------------------ */
function sunOpt(nodes, center){
  const data = nodes.map((n, i) => ({
    name:n.name, value:+(n.value*100).toFixed(2),
    itemStyle:{color:PAL.series[i]},
    children:n.children.map((k, j) => ({name:k.name, value:+(k.value*100).toFixed(2),
      itemStyle:{color:PAL.series[i], opacity:Math.max(.4, 1 - j*.13)},
      label:{show:k.value >= 0.05}}))}));
  return {
    tooltip:{trigger:'item', formatter:p => { const path = p.treePathInfo.map(x => x.name).filter(Boolean);
      return `<b>${esc(p.name)}</b> · ${p.value.toFixed(1)}%` + (path.length > 1 ? `<br><span style="color:${PAL.ink2}">${esc(path[0])}</span>` : ''); }},
    series:[{type:'sunburst', data, radius:['19%','97%'], center:['50%','50%'], sort:null, nodeClick:false,
      itemStyle:{borderColor:'rgba(9,13,28,.95)', borderWidth:2, borderRadius:3},
      emphasis:{focus:'ancestor', itemStyle:{shadowBlur:20, shadowColor:hexA(PAL.accent,.6)}},
      // Inner ring prints the sector % (names overflow narrow slices); the legend
      // beside it prints the same %, so ring ↔ legend never relies on colour.
      levels:[{}, {r0:'19%', r:'55%', label:Object.assign({rotate:0, fontSize:14, minAngle:10, formatter:p => p.value.toFixed(1) + '%'}, LBL)},
        {r0:'56.5%', r:'97%', label:Object.assign({rotate:'radial', fontSize:11.5, formatter:p => `${p.name} ${p.value.toFixed(1)}%`}, LBL)}]}],
    graphic:[{type:'text', left:'center', top:'middle', silent:true, style:{text:center, fill:PAL.ink, font:'800 15px Inter, sans-serif', textAlign:'center', textVerticalAlign:'middle'}}],
  };
}
function donutOpt(items, center){
  return {
    tooltip:{trigger:'item', formatter:p => `<b>${esc(p.name)}</b> · ${p.value.toFixed(1)}%`},
    series:[{type:'pie', radius:['48%','72%'], center:['50%','52%'], padAngle:2, minAngle:3, avoidLabelOverlap:true,
      itemStyle:{borderRadius:5, borderColor:'rgba(9,13,28,.8)', borderWidth:1},
      label:{color:PAL.ink, fontWeight:750, fontSize:12, formatter:p => `${p.name}\n{v|${p.value.toFixed(1)}%}`, rich:{v:{color:PAL.ink2, fontSize:11.5, fontWeight:600, padding:[3,0,0,0]}}},
      labelLine:{length:12, length2:10, lineStyle:{color:PAL.ink3}},
      emphasis:{scale:true, scaleSize:7},
      data:items.map((x, i) => ({name:x.name, value:+(x.value*100).toFixed(2), itemStyle:{color:PAL.series[i%7], decal:DECALS[i%7]}}))}],
    graphic:[{type:'text', left:'center', top:'52%', silent:true, style:{text:center, fill:PAL.ink, font:'800 15px Inter, sans-serif', textAlign:'center', textVerticalAlign:'middle'}}],
  };
}
const side = (rows, key) => { const o = [...rows].sort((a, b) => a[key] - b[key]); return r => o.indexOf(r) % 2 ? 'left' : 'right'; };
function lineArea(color){ return {color:{type:'linear', x:0, y:0, x2:0, y2:1, colorStops:[{offset:0, color:hexA(color,.38)}, {offset:1, color:hexA(color,0)}]}}; }
function valueLineOpt(v){
  return {
    grid:{left:66, right:96, top:20, bottom:30},
    tooltip:{trigger:'axis', formatter:p => `${dNice(p[0].value[0])}<br><b>${gbp(p[0].value[1])}</b>`},
    xAxis:AX({type:'time', splitLine:{show:false}, axisLabel:{formatter:'{MMM} {yy}'}}),
    yAxis:AX({type:'value', scale:true, axisLine:{show:false}, axisLabel:{formatter:x => gbpk(x)}}),
    series:[{type:'line', showSymbol:false, data:v.dates.map((d, i) => [d, v.values[i]]),
      lineStyle:{width:2.6, color:PAL.series[0]}, itemStyle:{color:PAL.series[0]}, areaStyle:lineArea(PAL.series[0]),
      endLabel:{show:true, formatter:p => gbpk(p.value[1]), color:PAL.ink, fontWeight:800, fontSize:13, distance:8}}],
  };
}
function gaugeOpt(g){
  const common = {type:'gauge', startAngle:210, endAngle:-30, min:0, max:g.max, center:['50%','60%'],
    axisTick:{show:false}, splitLine:{show:false}, axisLabel:{show:false}, pointer:{show:false}, anchor:{show:false}, title:{show:false}};
  const val = Math.min(g.value, g.max);
  const series = [Object.assign({}, common, {radius:'86%',
    progress:{show:true, width:16, roundCap:true, itemStyle:{color:g.color||PAL.series[0], shadowBlur:14, shadowColor:hexA(g.color||PAL.series[0],.55)}},
    axisLine:{roundCap:true, lineStyle:{width:16, color:[[1, PAL.track]]}},
    detail:{valueAnimation:!RM, offsetCenter:[0,'6%'], fontSize:30, fontWeight:800, fontFamily:'Inter, sans-serif', color:PAL.ink,
      formatter:x => g.fmt(g.value > g.max ? g.value : x)},
    data:[{value:val}]})];
  if(g.marker != null){ const f = Math.min(1, g.marker/g.max), e = .007;
    series.push(Object.assign({}, common, {radius:'97%', silent:true, animation:false, progress:{show:false}, detail:{show:false},
      axisLine:{lineStyle:{width:32, color:[[Math.max(0,f-e),'rgba(0,0,0,0)'], [Math.min(1,f+e), PAL.ink], [1,'rgba(0,0,0,0)']]}}, data:[{value:0}]})); }
  return {series};
}
const fgWord = v => v < 25 ? 'EXTREME FEAR' : v < 45 ? 'FEAR' : v <= 55 ? 'NEUTRAL' : v <= 75 ? 'GREED' : 'EXTREME GREED';
function fgOpt(v){
  const a = 'rgba(255,255,255,.07)', b = 'rgba(255,255,255,.15)', g = 'rgba(0,0,0,0)';
  return {series:[{type:'gauge', startAngle:210, endAngle:-30, min:0, max:100, radius:'74%', center:['50%','62%'], splitNumber:20,
    axisLine:{lineStyle:{width:16, color:[[.245,a],[.255,g],[.445,b],[.455,g],[.545,a],[.555,g],[.745,b],[.755,g],[1,a]]}},

    title:{show:false},

      rich:{n:{fontSize:28, fontWeight:800, color:PAL.ink, fontFamily:'Inter, sans-serif'}, w:{fontSize:12, fontWeight:800, color:PAL.ink2, fontFamily:'Inter, sans-serif'}}},
    data:[{value:v}]}]};
}
function riskScatterOpt(s){
  const rows = s.risk.rows.filter(r => r.rc != null);
  const ORDER = ['USD','GBP','EUR (NOK risk)'], present = new Set(rows.map(r => r.cur));

      itemStyle:{color:PAL.series[i], borderColor:'rgba(7,10,20,.85)', borderWidth:1.2}, emphasis:{scale:1.6},
      data:rows.filter(r => r.cur === c).map(r => ({value:[r.w*100, r.rc*100], r,

        label:{formatter:'risk share = weight', color:PAL.ink2, position:'insideMiddleTop'}, data:[[{coord:[0,0]}, {coord:[M,M]}]]}}; }),
  };
}
function rangeKey(s){ return st.range === '5Y' ? 'Max' : st.range; }

      return `${dNice(p[0].value[0])}<br>You <b>${gbp(a)}</b><br>VWRP, same deposits <b>${gbp(b)}</b><br>Gap ${mv(a-b, gbp(a-b,0,true))}`; }},
    xAxis:AX({type:'time', splitLine:{show:false}, axisLabel:{formatter:'{MMM} {yy}'}}),

      {name:'Your portfolio', type:'line', showSymbol:false, data:pts('actual'), lineStyle:{width:2.8, color:PAL.series[0]}, itemStyle:{color:PAL.series[0]},
        areaStyle:{color:hexA(PAL.series[0], .08)}, endLabel:{show:true, formatter:p => `You ${gbpk(p.value[1])}`, color:PAL.ink, fontWeight:800, distance:8}},
      {name:'VWRP bought with the same deposits', type:'line', showSymbol:false, data:pts('vwrp'), lineStyle:{width:2.8, type:[8,5], color:PAL.series[1]},
        itemStyle:{color:PAL.series[1]}, endLabel:{show:true, formatter:p => `VWRP ${gbpk(p.value[1])}`, color:PAL.ink, fontWeight:800, distance:8}}],

}
function wfOpt(sp){
  const parts = [['Capital (prices)', sp.capital], ['FX (sterling)', sp.fx], ['Dividends · 12m' + (IND ? ' ◇' : ''), sp.dividends]];
  let run = 0; const rows = parts.map(([n, v]) => { const r = [n, Math.min(run, run+v), Math.max(run, run+v), v, 0]; run += v; return r; });
  rows.push(['Total', Math.min(0, run), Math.max(0, run), run, 1]);
  return {
    grid:{left:70, right:20, top:34, bottom:34},
    tooltip:{trigger:'item', formatter:p => `${rows[p.dataIndex][0]}: <b>${gbp(rows[p.dataIndex][3],0,true)}</b>`},
    xAxis:AX({type:'category', data:rows.map(r => r[0]), axisLabel:{color:PAL.ink, fontWeight:650}}),
    yAxis:AX({type:'value', axisLine:{show:false}, axisLabel:{formatter:x => gbpk(x)}}),
    series:[{type:'custom', data:rows.map((r, i) => [i, r[1], r[2]]), encode:{x:0, y:[1,2]},
      renderItem:(params, api) => { const r = rows[params.dataIndex], i = api.value(0);
        const top = api.coord([i, r[2]]), bot = api.coord([i, r[1]]), w = api.size([1,0])[0] * .5;
        const col = r[4] ? PAL.series[2] : PAL.series[0];

  const B = Array.from({length:16}, () => ({x:rnd(), y:.42 + rnd() * .2, r:30 + rnd() * 70, a:.05 + rnd() * .09, s:.2 + rnd() * .6}));

    cv.width = W * d; cv.height = H * d; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.setTransform(d, 0, 0, d, 0, 0); }
  function frame(t){
    M.x += (M.tx - M.x) * .05; M.y += (M.ty - M.y) * .05;
    if(M.tpx < -5e3 || M.px < -5e3){ M.px = M.tpx; M.py = M.tpy; }
    else { M.px += (M.tpx - M.px) * .14; M.py += (M.tpy - M.py) * .14; }
    ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, W, H);
    const camX = (M.x - .5) * 1.4, camY = 1.15 + (M.y - .5) * .4, hz = H * (.30 - (M.y - .5) * .05), f = W * .42;
    const gx = W * (.25 + .5 * M.x), g0 = ctx.createRadialGradient(gx, hz + H * .2, 0, gx, hz + H * .2, W * .65);
    g0.addColorStop(0, 'rgba(24,100,200,.40)'); g0.addColorStop(.5, 'rgba(12,50,120,.16)'); g0.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g0; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    // soft bokeh haze along the horizon
    for(const b of B){ const x = ((b.x + t * .000004 * b.s) % 1.1) * W, y = b.y * H, gb = ctx.createRadialGradient(x, y, 0, x, y, b.r);
      gb.addColorStop(0, `rgba(80,190,255,${b.a})`); gb.addColorStop(1, 'rgba(80,190,255,0)'); ctx.fillStyle = gb; ctx.fillRect(x - b.r, y - b.r, b.r * 2, b.r * 2); }
    // wave surface: project every grid point, lift and brighten it near the cursor

      const Z = depth(r), a0 = fade(Z);

        const X = X0 + (X1 - X0) * c / (COLS - 1), k = r * COLS + c;
        const Y = .26 * Math.sin(.75 * X + t * .00045 + .5 * Z) + .18 * Math.sin(.6 * Z - t * .00035 + .25 * X) + .08 * Math.sin(1.9 * X + 1.3 * Z + t * .0008);
        const sx = W / 2 + (X - camX) / Z * f; let sy = hz + (camY - Y) / Z * f;

      ctx.beginPath(); for(let c = 0; c < COLS; c++){ const k = r * COLS + c; c ? ctx.lineTo(SX[k], SY[k]) : ctx.moveTo(SX[k], SY[k]); } ctx.stroke(); }
    ctx.strokeStyle = 'rgba(50,150,245,.13)';
    for(let c = 0; c < COLS; c += 6){ ctx.beginPath(); for(let r = 0; r < ROWS; r++){ const k = r * COLS + c; r ? ctx.lineTo(SX[k], SY[k]) : ctx.moveTo(SX[k], SY[k]); } ctx.stroke(); }
    for(let r = 0; r < ROWS; r++){
      const Z = depth(r), base = fade(Z) * .85, sz = Math.max(1, 5 / Z), dim = `rgba(130,215,255,${Math.min(1, base).toFixed(3)})`;
      ctx.fillStyle = dim;
      for(let c = 0; c < COLS; c++){ const k = r * COLS + c, x = SX[k], y = SY[k];
        if(x < -4 || x > W + 4 || y > H + 4) continue;
        if(SA[k] > base * 1.25){ ctx.fillStyle = `rgba(170,235,255,${Math.min(1, SA[k]).toFixed(3)})`; ctx.fillRect(x, y, sz * 1.4, sz * 1.4); ctx.fillStyle = dim; }
        else ctx.fillRect(x, y, sz, sz); }
    }
    // glowing node mesh riding the wave
    for(const [a, b] of links){ const al = Math.min(SA[a], SA[b]) * .45; if(al < .01) continue;
      ctx.strokeStyle = `rgba(86,180,233,${al.toFixed(3)})`; ctx.beginPath(); ctx.moveTo(SX[a], SY[a]); ctx.lineTo(SX[b], SY[b]); ctx.stroke(); }
    for(const k of nodes){ const x = SX[k], y = SY[k], al = SA[k], rr = 9 / depth(k / COLS | 0);
      if(x < -20 || x > W + 20 || y > H + 20) continue;
      ctx.fillStyle = `rgba(86,190,255,${(al * .22).toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, rr * 3, 0, 6.283); ctx.fill();
      ctx.fillStyle = `rgba(190,240,255,${Math.min(1, al * 1.3).toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, Math.max(1, rr * .55), 0, 6.283); ctx.fill(); }
    // light streaks on a slow flow field; they swirl away from the cursor
    ctx.lineWidth = 1.3;
    for(const p of P){
      const ang = -.22 + .55 * Math.sin(p.x * .0024 + t * .00012) * Math.cos(p.y * .0031 - t * .0001) + .25 * Math.sin((p.x - p.y) * .0012 + t * .00008);
      let vx = Math.cos(ang) * p.sp, vy = Math.sin(ang) * p.sp, hot = 0;
      const dx = p.x - M.px, dy = p.y - M.py, d = Math.sqrt(dx * dx + dy * dy);
      if(d < 220 && d > 1){ const k = 1 - d / 220; hot = k; vx += (dx / d * 2.0 - dy / d * 1.6) * k; vy += (dy / d * 2.0 + dx / d * 1.6) * k; }
      p.vx += (vx - p.vx) * .15; p.vy += (vy - p.vy) * .15; p.x += p.vx; p.y += p.vy; p.life--;
      if(p.x > W + 40 || p.y < -40 || p.y > H + 40 || p.life < 0) spawn(p, p.x > W + 40);
      ctx.strokeStyle = `rgba(${hot > .1 ? '170,240,255' : '90,200,240'},${Math.min(.9, p.a + hot * .5).toFixed(3)})`;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * p.len, p.y - p.vy * p.len); ctx.stroke();
    }
  }
  function loop(t){ requestAnimationFrame(loop); if(!document.hidden) frame(t); }
  size(); P.forEach(p => spawn(p, false));
  addEventListener('resize', () => { size(); if(RM) frame(0); });
  addEventListener('pointermove', e => { M.tx = e.clientX / W; M.ty = e.clientY / H; M.tpx = e.clientX; M.tpy = e.clientY; }, {passive:true});
  document.documentElement.addEventListener('pointerleave', () => { M.tpx = M.tpy = -1e4; });
  if(RM) frame(0); else requestAnimationFrame(loop);
})();

/* ------------------------------ shell ------------------------------ */
const RENDER = {front, alloc, perf, val, hold};
let lastTab = 'front';
function countUps(root){ if(RM) return; root.querySelectorAll('[data-count]').forEach(e => { const to = +e.dataset.count, f = FMT[e.dataset.fmt || 'int'], t0 = performance.now(), D = 1000;
  const step = t => { const k = Math.min(1, (t - t0) / D); e.textContent = f(to * (1 - Math.pow(1 - k, 3))); if(k < 1) requestAnimationFrame(step); else e.textContent = f(to); };
  requestAnimationFrame(step); }); }
function moveInk(){ const b = document.querySelector(`nav.tabs [data-tab="${st.tab}"]`), ink = document.querySelector('nav.tabs .ink');
  ink.style.left = b.offsetLeft + 'px'; ink.style.width = b.offsetWidth + 'px'; }
function render(){
  const pane = document.querySelector(`.pane[data-pane="${st.tab}"]`), dir = TABS.indexOf(st.tab) >= TABS.indexOf(lastTab) ? 'from-r' : 'from-l';
  document.querySelectorAll('.pane').forEach(p => { Chart.disposeIn(p); if(p !== pane){ p.innerHTML = ''; p.className = 'pane'; } });
  pending = []; perfCharts = {};
  pane.innerHTML = RENDER[st.tab](S());
  pane.className = 'pane'; void pane.offsetWidth; pane.className = 'pane on ' + dir;
  pane.querySelectorAll('.rise').forEach((e, i) => e.style.setProperty('--i', Math.min(i, 16)));
  flush(); countUps(pane);
  document.querySelectorAll('nav.tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === st.tab));
  document.querySelectorAll('[data-scope]').forEach(b => b.setAttribute('aria-pressed', b.dataset.scope === st.scope));
  moveInk(); lastTab = st.tab;
  try{ history.replaceState(null, '', '#' + st.tab + (st.scope !== 'All' ? '-' + st.scope : '') + (st.stale ? '-stale' : '')); }catch(e){}
}
function chrome(){
  const m = DATA.meta, sp = DATA.stale_preview;
  document.getElementById('ind-note').textContent = m.indicative_note;
  document.querySelector('.ind-banner b').textContent = IND ? 'INDICATIVE PROTOTYPE' : 'LIVE DATA';
  document.getElementById('stale-text').textContent = `Data is ${sp.age_h} h old (as of ${sp.as_of}): ${sp.reason}. Figures below are NOT current.`;
  document.getElementById('fresh').innerHTML = st.stale ? `<span class="g">■</span> STALE · as of ${esc(sp.as_of)} (${sp.age_h} h)`
    : `<span class="g">●</span> FRESH · as of ${esc(m.stamp)} · ${esc(m.built)}`;

  document.querySelector('[data-act=stale]').setAttribute('aria-pressed', st.stale);
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab],[data-scope],[data-act],[data-cal],[data-range],th[data-sort],tr.hr'); if(!t) return;
  if(t.dataset.tab){ st.tab = t.dataset.tab; render(); }
  else if(t.dataset.scope){ st.scope = t.dataset.scope; st.cal = 0; render(); }
  else if(t.dataset.act === 'stale'){ st.stale = !st.stale; chrome(); render(); }
  else if(t.dataset.cal){ st.cal = Math.max(0, st.cal + +t.dataset.cal); document.getElementById('cal').innerHTML = calendar(S()); }
  else if(t.dataset.range){ setRange(t.dataset.range); }
  else if(t.matches('th[data-sort]')){ const tbl = t.closest('table').dataset.tbl, key = t.dataset.sort, cur = tbl === 'risk' ? st.rsort : st.hsort;
    const next = [key, cur[0] === key ? -cur[1] : (key === 't' || key === 'ticker' ? 1 : -1)];
    if(tbl === 'risk'){ st.rsort = next; document.getElementById('rtab').innerHTML = riskTable(S()); }
    else { st.hsort = next; document.getElementById('htab').innerHTML = holdTable(S()); } }
  else if(t.matches('tr.hr')){ t.classList.toggle('open'); const d = t.nextElementSibling; d.classList.toggle('open');
    const el = d.querySelector('[data-spark]'); if(el && d.classList.contains('open') && !el.dataset.done){ el.dataset.done = 1; Chart.mount(el, sparkOpt(S().holdings[+el.dataset.spark].spark)); } }
});
window.addEventListener('resize', moveInk);
const h = (location.hash || '').replace('#', '').split('-');
if(TABS.includes(h[0])) st.tab = h[0];
if(DATA.scopes[h[1]]) st.scope = h[1];
if(h.includes('stale') || DATA.meta.live_stale) st.stale = true;
lastTab = st.tab; chrome(); render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(moveInk);

};</script>
<script>
(function(){
'use strict';
const CFG = {"repo": "GForce1700/Portfolio-data", "schema": "cockpit-v2/0.1"}, KEY = 'cockpit-v2:token', RKEY = 'cockpit-v2:repo';
const $ = id => document.getElementById(id);
const store = (k, v) => { try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} };
const read = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
function ask(msg){ $('gate').hidden = false; $('gate-msg').textContent = msg || '';
  $('gate-repo').value = read(RKEY) || CFG.repo || ''; $('gate-token').focus(); }
// ?local reads ./data.json + ./status.json beside the page (publish_dashboard.py --stage, then a
// local http server): the whole loader, gate and stale path test without GitHub or a token.
const LOCAL = new URLSearchParams(location.search).has('local');
async function get(repo, tok, path){
  const r = LOCAL ? await fetch('./' + path, {cache:'no-store'}) : await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {cache:'no-store',
    headers:{Authorization:'Bearer ' + tok, Accept:'application/vnd.github.raw+json', 'X-GitHub-Api-Version':'2022-11-28'}});
  if(!r.ok) throw new Error(String(r.status));
  return r.json();
}
const fill = (o, kw) => JSON.parse(JSON.stringify(o).replace(/\{(\w+)\}/g, (m, k) => k in kw ? kw[k] : m));
function freshness(d, s){
  const n = new Date(), z = x => String(x).padStart(2, '0');
  d.meta.today = `${n.getFullYear()}-${z(n.getMonth() + 1)}-${z(n.getDate())}`;   // the calendar's "today" is the viewer's
  if(!s) return;
  const age = (n - Date.parse(s.fetched_at)) / 36e5, lim = d.meta.stale_after_h;
  if(s.held || age > lim){
    const kw = {hours: Math.round(age), date: s.fetched_label};
    d.stale_preview = {age_h: Math.round(age), as_of: s.fetched_label, queue: [s.held ? s.held_card : fill(s.stale_card, kw)],
      reason: s.held ? s.reason : `the last good T212 read is ${Math.round(age)} h old (limit ${lim} h)`};
    d.meta.live_stale = true;
  }
}
async function boot(){
  const repo = read(RKEY) || CFG.repo, tok = read(KEY);
  if(!LOCAL && (!repo || !tok)) return ask();
  let data, status;
  try{ [data, status] = await Promise.all([get(repo, tok, 'data.json'), get(repo, tok, 'status.json').catch(() => null)]); }
  catch(e){ const c = e.message;
    return ask(c === '401' || c === '403' ? 'GitHub refused that token (expired, or not scoped to this repo). Paste a fresh read-only token.'
      : c === '404' ? `Nothing at ${repo}/data.json. Check the repo name, or whether the nightly publish has run yet.`
      : `Could not reach GitHub (${c}). Offline?`); }
  if(data.schema !== CFG.schema) return ask(`This page reads ${CFG.schema} but the data is ${data.schema}. Rebuild the shell.`);
  freshness(data, status);
  $('cockpit-data').textContent = JSON.stringify(data);
  $('gate').hidden = true;
  window.__cockpit();
}
$('gate-form').addEventListener('submit', ev => { ev.preventDefault();
  store(RKEY, $('gate-repo').value.trim()); store(KEY, $('gate-token').value.trim()); $('gate-token').value = ''; boot(); });
$('gate-forget').addEventListener('click', () => { store(KEY, null); ask('Token forgotten on this browser.'); });
boot();
})();
</script>
